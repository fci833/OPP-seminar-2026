<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta
    name="description"
    content="OPP Seminar 2026 – agenda, grupper og personlig oversigt."
  >

  <title>OPP Seminar 2026</title>

  <style>
    :root {
      --navy: #001965;
      --dark-navy: #00113f;
      --blue: #005ad2;
      --medium-blue: #0075c9;
      --cyan: #00b8de;
      --light-cyan: #79e2f2;
      --background: #eef8fc;
      --background-dark: #dff1f9;
      --surface: #ffffff;
      --surface-soft: #f7fbfd;
      --text: #061a33;
      --muted: #5b6d80;
      --border: #b9ddf1;
      --success: #007a5e;

      --shadow:
        0 20px 50px rgba(0, 49, 92, 0.12),
        0 5px 14px rgba(0, 49, 92, 0.06);

      --content-width: 1100px;
      --radius-large: 28px;
      --radius-medium: 20px;
      --radius-small: 13px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(
          circle at 8% 20%,
          rgba(0, 184, 222, 0.09),
          transparent 25rem
        ),
        radial-gradient(
          circle at 92% 75%,
          rgba(0, 90, 210, 0.08),
          transparent 30rem
        ),
        linear-gradient(
          180deg,
          #f7fbfd 0%,
          var(--background) 55%,
          #e4f3f9 100%
        );
      font-family:
        Aptos,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
    }

    button,
    input,
    a {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      min-height: 78px;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid rgba(0, 25, 101, 0.08);
      box-shadow: 0 5px 18px rgba(0, 25, 101, 0.05);
    }

    .nav {
      width: min(var(--content-width), calc(100% - 32px));
      min-height: 78px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 42px;
    }

    .nav-link {
      position: relative;
      padding: 17px 7px;
      color: var(--dark-navy);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 850;
      white-space: nowrap;
    }

    .nav-link::after {
      position: absolute;
      right: 7px;
      bottom: 8px;
      left: 7px;
      height: 3px;
      content: "";
      background: var(--cyan);
      border-radius: 20px;
      transform: scaleX(0);
      transition: transform 180ms ease;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
    }

    .page-shell {
      width: min(var(--content-width), calc(100% - 32px));
      min-height: 800px;
      margin: 0 auto;
      padding: 46px 0 80px;
    }

    .page-hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 38px;
      padding: 45px 48px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          var(--dark-navy) 0%,
          var(--navy) 58%,
          #003c89 100%
        );
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .page-hero.light {
      color: var(--text);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 90, 210, 0.09);
    }

    .page-hero::before {
      position: absolute;
      width: 175px;
      height: 175px;
      top: -105px;
      right: -48px;
      content: "";
      border: 30px solid rgba(65, 213, 239, 0.13);
      border-radius: 50%;
      pointer-events: none;
    }

    .page-hero::after {
      position: absolute;
      width: 190px;
      height: 190px;
      right: 70px;
      bottom: -170px;
      content: "";
      background: rgba(0, 184, 222, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .page-hero.light .eyebrow {
      color: var(--blue);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      position: relative;
      z-index: 1;
      max-width: 850px;
      margin-bottom: 15px;
      font-size: clamp(2.3rem, 6vw, 4.15rem);
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    h2 {
      margin-bottom: 19px;
      color: var(--dark-navy);
      font-size: clamp(1.65rem, 4vw, 2.25rem);
      letter-spacing: -0.025em;
    }

    h3 {
      color: var(--dark-navy);
    }

    .lead {
      position: relative;
      z-index: 1;
      max-width: 750px;
      margin-bottom: 0;
      color: rgba(255, 255, 255, 0.84);
      font-size: 1.1rem;
      line-height: 1.65;
    }

    .page-hero.light .lead {
      color: var(--muted);
    }

    .hero-highlight {
      color: #4edcf4;
    }

    .section {
      margin-top: 42px;
    }

    .section-intro {
      max-width: 780px;
      margin: -7px 0 22px;
      color: var(--muted);
      line-height: 1.65;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(0, 90, 210, 0.09);
      border-radius: var(--radius-medium);
      box-shadow: var(--shadow);
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 21px;
      color: #ffffff;
      background: var(--navy);
      border-radius: 13px;
      box-shadow: 0 8px 18px rgba(0, 25, 101, 0.22);
      cursor: pointer;
      text-decoration: none;
      font-weight: 850;
      transition:
        transform 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    .button:hover {
      background: var(--blue);
      box-shadow: 0 12px 24px rgba(0, 90, 210, 0.24);
      transform: translateY(-2px);
    }

    .button:focus-visible,
    .nav-link:focus-visible,
    .search-input:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
    }

    /* Agenda */

    .agenda-list {
      overflow: hidden;
    }

    .agenda-row {
      display: grid;
      min-height: 94px;
      grid-template-columns: 44px 135px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 17px;
      padding: 17px 24px;
      border-bottom: 1px solid var(--border);
      transition: background 150ms ease;
    }

    .agenda-row:last-child {
      border-bottom: 0;
    }

    .agenda-row:hover {
      background: var(--surface-soft);
    }

    .agenda-number {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--navy);
      background: #bfe6fa;
      border-radius: 50%;
      font-size: 0.86rem;
      font-weight: 900;
    }

    .agenda-row.has-link .agenda-number {
      color: #ffffff;
      background: var(--navy);
    }

    .agenda-time {
      color: var(--navy);
      font-size: 0.94rem;
      font-weight: 900;
    }

    .agenda-title {
      margin-bottom: 5px;
      font-size: 1.08rem;
      font-weight: 900;
    }

    .agenda-description {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .agenda-arrow {
      color: var(--blue);
      font-size: 1.7rem;
      font-weight: 900;
      text-decoration: none;
    }

    .find-callout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 26px;
      margin-top: 38px;
      padding: 33px;
    }

    .find-callout h2 {
      margin-bottom: 9px;
    }

    .find-callout p:last-child {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Find mig */

    .search-card {
      padding: 31px;
    }

    .search-label {
      display: block;
      margin-bottom: 13px;
      color: var(--dark-navy);
      font-weight: 900;
    }

    .search-wrapper {
      display: flex;
      min-height: 66px;
      align-items: center;
      gap: 14px;
      padding: 0 19px;
      background: #ffffff;
      border: 2px solid #a9dcf5;
      border-radius: 16px;
      box-shadow: 0 4px 0 rgba(0, 90, 210, 0.06);
    }

    .search-icon {
      color: var(--blue);
      font-size: 1.5rem;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      padding: 19px 0;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 1.08rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .search-input::placeholder {
      color: #91a2b7;
      font-weight: 500;
      text-transform: none;
    }

    .search-help {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .search-results {
      display: grid;
      gap: 20px;
      margin-top: 27px;
    }

    .empty-state {
      padding: 31px;
      text-align: center;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .person-result {
      overflow: hidden;
    }

    .person-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 17px;
      padding: 22px 25px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--blue)
        );
    }

    .person-header h3 {
      margin: 0;
      color: #ffffff;
      font-size: 1.5rem;
    }

    .person-header span {
      color: #bfefff;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .result-item {
      min-height: 125px;
      padding: 22px;
      border-right: 1px solid var(--border);
    }

    .result-item:last-child {
      border-right: 0;
    }

    .result-label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .result-value {
      color: var(--dark-navy);
      font-size: 1.04rem;
      font-weight: 900;
      line-height: 1.5;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 17px;
    }

    .suggestion {
      padding: 9px 13px;
      color: var(--navy);
      background: #dff4fb;
      border: 1px solid #b8e1f4;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 850;
    }

    .suggestion:hover {
      color: #ffffff;
      background: var(--blue);
    }

    /* Grupper */

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .group-card {
      overflow: hidden;
    }

    .group-header {
      position: relative;
      overflow: hidden;
      display: flex;
      min-height: 76px;
      align-items: center;
      gap: 13px;
      padding: 19px 23px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          var(--dark-navy),
          var(--navy)
        );
    }

    .group-header::after {
      position: absolute;
      width: 115px;
      height: 115px;
      top: -68px;
      right: -30px;
      content: "";
      background: rgba(0, 184, 222, 0.12);
      border-radius: 50%;
    }

    .group-icon {
      display: grid;
      width: 39px;
      height: 39px;
      flex: 0 0 auto;
      place-items: center;
      background: rgba(0, 184, 222, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 11px;
      font-size: 1.15rem;
    }

    .group-header h3 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #ffffff;
      font-size: 1.08rem;
    }

    .group-room {
      position: relative;
      z-index: 1;
      margin-left: auto;
      color: #bcefff;
      font-size: 0.78rem;
      font-weight: 850;
      text-align: right;
    }

    .members {
      margin: 0;
      padding: 0 23px 17px;
      list-style: none;
    }

    .member {
      padding: 13px 0 11px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .member:last-child {
      border-bottom: 0;
    }

    /* Tabeller */

    .table-card {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 790px;
      border-collapse: collapse;
    }

    th {
      padding: 17px 18px;
      color: #ffffff;
      background: var(--navy);
      text-align: left;
      font-size: 0.84rem;
      vertical-align: top;
    }

    th small {
      display: block;
      margin-top: 4px;
      color: #bdefff;
      font-size: 0.7rem;
      font-weight: 700;
    }

    td {
      padding: 19px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
      font-weight: 750;
    }

    tbody tr:nth-child(even) {
      background: var(--surface-soft);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    /* Lokation og kort */

    .location-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      padding: 28px;
    }

    .location-card h3 {
      margin-bottom: 8px;
      font-size: 1.25rem;
    }

    .location-card p:last-child {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .room-map-card {
      padding: 18px;
    }

    .room-map {
      display: grid;
      min-height: 515px;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      padding: 16px;
      background: #e6ecef;
      border: 1px solid #cadce6;
      border-radius: 18px;
    }

    .room {
      display: flex;
      min-height: 105px;
      align-items: center;
      justify-content: center;
      padding: 17px;
      color: #ffffff;
      border: 3px solid #ffffff;
      border-radius: 16px;
      box-shadow: 0 5px 12px rgba(0, 25, 101, 0.13);
      text-align: center;
      font-weight: 900;
      line-height: 1.4;
    }

    .room.blue {
      background: var(--blue);
    }

    .room.navy {
      background: var(--navy);
    }

    .room.cyan {
      color: var(--dark-navy);
      background: #69ddec;
    }

    .room.teal {
      background: #008b99;
    }

    .room.orange {
      color: #321500;
      background: #ff9d37;
    }

    .room.purple {
      background: #7050a0;
    }

    .room.green {
      color: #073627;
      background: #82d9bd;
    }

    .room.terrace {
      color: var(--dark-navy);
      background:
        repeating-linear-gradient(
          45deg,
          #d8f3df,
          #d8f3df 20px,
          #c9ecd4 20px,
          #c9ecd4 40px
        );
    }

    .room.foyer {
      color: var(--dark-navy);
      background: #eef2f5;
    }

    .info-box {
      margin-top: 24px;
      padding: 24px;
      color: var(--dark-navy);
      background: #dff4fb;
      border: 1px solid #b9e0f2;
      border-radius: var(--radius-medium);
    }

    .info-box strong {
      display: block;
      margin-bottom: 6px;
    }

    .info-box p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Fejlvisning */

    .error-card {
      padding: 35px;
      border-left: 7px solid #c82929;
    }

    .error-card h2 {
      color: #8d1818;
    }

    .error-card code {
      display: block;
      margin-top: 15px;
      padding: 15px;
      overflow-wrap: anywhere;
      color: #7e1717;
      background: #fff0f0;
      border-radius: 10px;
    }

    /* Footer */

    .site-footer {
      padding: 33px 16px 38px;
      background: rgba(255, 255, 255, 0.86);
      border-top: 1px solid rgba(0, 25, 101, 0.08);
      text-align: center;
    }

    .site-footer p {
      margin: 5px 0;
      color: var(--dark-navy);
      font-size: 0.88rem;
      font-weight: 850;
    }

    .footer-dot {
      margin-right: 6px;
      color: var(--cyan);
    }

    @media (max-width: 850px) {
      .nav {
        gap: 19px;
      }

      .groups-grid {
        grid-template-columns: 1fr;
      }

      .result-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .result-item:nth-child(2) {
        border-right: 0;
      }

      .result-item:nth-child(-n + 2) {
        border-bottom: 1px solid var(--border);
      }

      .agenda-row {
        grid-template-columns: 40px 110px minmax(0, 1fr) 28px;
        gap: 11px;
        padding: 17px;
      }

      .find-callout,
      .location-card {
        grid-template-columns: 1fr;
      }

      .room-map {
        min-height: auto;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
      }

      .room {
        grid-column: auto !important;
        grid-row: auto !important;
        min-height: 145px;
      }
    }

    @media (max-width: 650px) {
      body {
        padding-bottom: 70px;
      }

      .site-header {
        position: static;
        min-height: 0;
      }

      .nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1000;
        width: 100%;
        min-height: 67px;
        justify-content: space-around;
        gap: 0;
        padding: 4px;
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid rgba(0, 25, 101, 0.1);
        box-shadow: 0 -8px 24px rgba(0, 25, 101, 0.08);
      }

      .nav-link {
        padding: 14px 5px;
        font-size: 0.69rem;
      }

      .nav-link::after {
        bottom: 7px;
      }

      .page-shell {
        width: min(100% - 20px, var(--content-width));
        padding: 20px 0 45px;
      }

      .page-hero {
        margin-bottom: 26px;
        padding: 31px 24px;
        border-radius: 22px;
      }

      .lead {
        font-size: 0.98rem;
      }

      .agenda-row {
        grid-template-columns: 36px minmax(0, 1fr) 25px;
      }

      .agenda-number {
        grid-row: 1 / span 2;
        width: 34px;
        height: 34px;
      }

      .agenda-time {
        grid-column: 2;
        font-size: 0.82rem;
      }

      .agenda-content {
        grid-column: 2;
      }

      .agenda-arrow {
        grid-column: 3;
        grid-row: 1 / span 2;
      }

      .search-card {
        padding: 21px;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .result-item,
      .result-item:nth-child(2) {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .result-item:last-child {
        border-bottom: 0;
      }

      .person-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .room-map {
        grid-template-columns: 1fr;
      }

      .room {
        min-height: 125px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primær navigation">
      <a class="nav-link" href="#agenda" data-route="agenda">
        Agenda
      </a>

      <a class="nav-link" href="#find" data-route="find">
        Find mig
      </a>

      <a class="nav-link" href="#ai" data-route="ai">
        AI Speed Dating
      </a>

      <a class="nav-link" href="#goboat" data-route="goboat">
        GoBoat
      </a>

      <a class="nav-link" href="#dinner" data-route="dinner">
        Middag
      </a>
    </nav>
  </header>

  <main id="app" class="page-shell">
    <section class="card" style="padding: 30px;">
      <h2>Indlæser OPP Seminar...</h2>
      <p>Vent et øjeblik.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      <span class="footer-dot">●</span>
      OPP Seminar
    </p>

    <p>
      Planlagt og udviklet af FCI & KUQA
    </p>
  </footer>

  <script>
    "use strict";

    /*
      ==========================================================
      INDSTILLINGER
      Ret tider, adresser og tekster i dette område.
      ==========================================================
    */

    const EVENT_CONFIG = {
      title: "OPP Seminar 2026",
      tagline:
        "En dag med ny viden, fælles oplevelser og gode samtaler.",

      goBoatAddress:

    function createSeededRandom(seedText) {
      let seed = 2166136261;

      for (let index = 0; index < seedText.length; index += 1) {
        seed ^= seedText.charCodeAt(index);
        seed = Math.imul(seed, 16777619);
      }

      return function () {
        seed += 0x6D2B79F5;

        let value = seed;

        value = Math.imul(
          value ^ (value >>> 15),
          value | 1
        );

        value ^= value + Math.imul(
          value ^ (value >>> 7),
          value | 61
        );

        return (
          ((value ^ (value >>> 14)) >>> 0) /
          4294967296
        );
      };
    }

    function seededShuffle(items, seedText) {
      const result = items.slice();
      const random = createSeededRandom(seedText);

      for (
        let index = result.length - 1;
        index > 0;
        index -= 1
      ) {
        const target = Math.floor(
          random() * (index + 1)
        );

        const temporary = result[index];
        result[index] = result[target];
        result[target] = temporary;
      }

      return result;
    }

    function makeBalancedGroups(
      items,
      numberOfGroups,
      seedText
    ) {
      const shuffled = seededShuffle(items, seedText);

      const result = Array.from(
        { length: numberOfGroups },
        function () {
          return [];
        }
      );

      shuffled.forEach(function (participant, index) {
        result[index % numberOfGroups].push(participant);
      });

      result.forEach(function (group) {
        group.sort();
      });

      return result;
    }

    function initialiseSearch() {
      const input = document.getElementById(
        "initialSearch"
      );

      const results = document.getElementById(
        "searchResults"
      );

      if (!input || !results) {
        return;
      }

      function updateSearchResults() {
        const query = input.value
          .trim()
          .toUpperCase();

        if (!query) {
          results.innerHTML = `
            <div class="empty-state card">
              <p>
                Indtast dine initialer ovenfor
                for at se din personlige oversigt.
              </p>
            </div>
          `;

          return;
        }

        if (participants.indexOf(query) !== -1) {
          results.innerHTML =
            createPersonResult(query);

          return;
        }

        const suggestions = participants
          .filter(function (initials) {
            return (
              initials.indexOf(query) !== -1 ||
              query.indexOf(initials) !== -1
            );
          })
          .slice(0, 10);

        results.innerHTML = `

            <p>
              Vi kunne ikke finde
              <strong>${escapeHtml(query)}</strong>.
              Kontrollér initialerne og prøv igen.

                      return `

                          class="suggestion"
                          type="button"
                          data-suggestion="${escapeHtml(initials)}"
                        >
                          ${escapeHtml(initials)}
                        </button>
                      `;
                    }).join("")}
                  </div>
                `
                : ""
            }
          </div>
        `;

        const suggestionButtons =
          document.querySelectorAll(
            "[data-suggestion]"
          );

        suggestionButtons.forEach(function (button) {
          button.addEventListener(
            "click",
            function () {
              input.value =
                button.dataset.suggestion;

              updateSearchResults();
            }
          );
        });
      }

      input.addEventListener(
        "input",
        updateSearchResults
      );

      input.focus();
    }

                style="grid-column: 4; grid-row: 4;"
              >
                Parkering
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Middagsborde</h2>

          ${createGroupCards(
            groups.dinner,
            "Bord"
          )}
        </section>
      `;
    }

    /*
      ==========================================================
      ROUTER OG OPSTART

      Denne del sørger for, at siden også starter inde i
      en Streamlit-komponent.
      ==========================================================
    */

    const routes = {
      agenda: renderAgenda,
      find: renderFind,
      evolve: renderEvolve,
      ai: renderAI,
      goboat: renderGoBoat,
      dinner: renderDinner
    };

    function renderRoute() {
      const requestedRoute = getRoute();

      const route = routes[requestedRoute]
        ? requestedRoute
        : "agenda";

      setActiveNavigation(route);

      routes[route]();

      scrollToTop();
    }

    function showStartupError(error) {
      console.error(
        "OPP Seminar kunne ikke starte:",
        error
      );

      app.innerHTML = `
        <section class="error-card card">
          <h2>
            Indholdet kunne ikke indlæses
          </h2>

          <p>
            Der opstod en fejl i hjemmesidens JavaScript.
          </p>

          <code>
            ${escapeHtml(
              error && error.message
                ? error.message
                : String(error)
            )}
          </code>
        </section>
      `;
    }

    function startApp() {
      try {
        renderRoute();
      } catch (error) {
        showStartupError(error);
      }
    }

    window.addEventListener(
      "hashchange",
      startApp
    );

    /*
      Start med det samme. Det er vigtigt, når siden
      indlæses gennem Streamlit components.html().
    */
    startApp();
  </script>
</body>
</html>
